version: '3'

tasks:
  generate:
    desc: Generiert sqlc- und OpenAPI-Code
    cmds:
      - task: generate:sqlc
      - task: generate:api
      - task: generate:client

  generate:sqlc:
    desc: Generiert typsicheren DB-Code mit sqlc (per Docker)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}/backend:/src" -w /src sqlc/sqlc:1.29.0 generate

  generate:api:
    desc: Generiert den Go-Server aus api/openapi.yaml
    dir: backend
    cmds:
      - go tool oapi-codegen -config oapi-codegen.yaml ../api/openapi.yaml

  test:
    desc: Führt alle Backend-Tests aus (Docker muss laufen)
    dir: backend
    cmds:
      - go test ./...

  generate:client:
    desc: Generiert den Angular-API-Client aus api/openapi.yaml
    dir: frontend
    cmds:
      - npm run generate:api

  lint:
    desc: Linter für das Backend
    dir: backend
    cmds:
      - golangci-lint run ./...

  test:frontend:
    desc: Führt die Frontend-Tests aus
    dir: frontend
    cmds:
      - npx ng test --watch=false

  up:
    desc: Startet den kompletten Stack (http://localhost:4200)
    cmds:
      - docker compose up -d --build

  down:
    desc: Stoppt den Stack (Daten bleiben erhalten)
    cmds:
      - docker compose down

  logs:
    desc: Zeigt die Logs aller Dienste
    cmds:
      - docker compose logs -f

  seed:
    desc: Lädt Demo-Daten in den laufenden Stack (nur bei leerer Datenbank)
    dir: backend
    cmds:
      - go run ./cmd/seed -url {{.URL | default "http://localhost:4200"}}

  screenshots:
    desc: Erstellt README-Screenshots (Stack muss laufen und Demo-Daten enthalten)
    dir: tools/screenshots
    cmds:
      - npm install --no-audit --no-fund
      - npx playwright install chromium
      - BASE_URL={{.URL | default "http://localhost:4200"}} npm run shoot
