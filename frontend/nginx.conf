server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Alle Backend-Routen liegen unter /api. Der Name wird zur Laufzeit aufgelöst (Docker-DNS),
    # damit ein neu gestartetes Backend mit neuer IP erreichbar bleibt; die Variable lässt die Request-URI unverändert.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://backend:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }

    # index.html verweist auf Hash-Dateinamen und darf nie veraltet aus dem Cache kommen.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Gehashte Assets: ein Jahr cachen; fehlende Dateien sind 404 und nicht der SPA-Fallback.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Single-Page-App: unbekannte Pfade liefern index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
