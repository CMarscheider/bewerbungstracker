<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/" tabindex="-1" aria-hidden="true">Bewerbungs-Tracker</a>
  <nav aria-label="Hauptnavigation">
    @for (link of links; track link.path) {
      <a mat-button [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: link.exact }">{{ link.label }}</a>
    }
  </nav>
  <span class="spacer"></span>
  <app-theme-toggle />
  <a mat-flat-button routerLink="/bewerbungen/neu">Neue Bewerbung</a>
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
