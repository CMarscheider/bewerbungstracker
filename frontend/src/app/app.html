<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/">Bewerbungs-Tracker</a>
  <nav>
    @for (link of links; track link.path) {
      <a mat-button [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.exact }">{{ link.label }}</a>
    }
  </nav>
  <span class="spacer"></span>
  <a mat-flat-button routerLink="/bewerbungen/neu">Neue Bewerbung</a>
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
