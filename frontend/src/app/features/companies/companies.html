<h1>Firmen</h1>

@if (companies().length === 0) {
  <p class="muted">Noch keine Firmen. Firmen entstehen beim Anlegen einer Bewerbung.</p>
}
<ul class="list">
  @for (c of companies(); track c.id) {
    <li>
      @if (editingId() === c.id) {
        <form class="rename" (ngSubmit)="saveRename(c)">
          <mat-form-field subscriptSizing="dynamic">
            <mat-label>Name</mat-label>
            <input matInput [formControl]="name" />
          </mat-form-field>
          <button mat-flat-button type="submit">Speichern</button>
          <button mat-button type="button" (click)="editingId.set(null)">Abbrechen</button>
        </form>
      } @else {
        <span class="name">{{ c.name }}</span>
        <span class="muted">{{ c.application_count }} Bewerbung(en)</span>
        <span class="actions">
          <button mat-button (click)="startRename(c)">Umbenennen</button>
          <button mat-button class="danger" (click)="remove(c)" [disabled]="c.application_count > 0" title="Nur Firmen ohne Bewerbungen können gelöscht werden">Löschen</button>
        </span>
      }
    </li>
  }
</ul>
