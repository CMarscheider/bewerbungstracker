openapi: 3.0.3
info:
  title: Bewerbungs-Tracker API
  version: 1.0.0
  description: >
    Verwaltung von Bewerbungen. Jeder Statuswechsel wird als Ereignis gespeichert;
    der aktuelle Status ergibt sich aus dem zuletzt erfassten Ereignis.
    Fehler werden als application/problem+json (RFC 9457) geliefert.
tags:
  - name: Companies
    description: Firmen
  - name: Applications
    description: Bewerbungen und Ereignisse
  - name: Dashboard
    description: "Übersicht: Fristen, Termine, Statistik"
  - name: Cv
    description: Lebenslauf
paths:
  /api/v1/companies:
    get:
      operationId: listCompanies
      tags: [Companies]
      summary: Alle Firmen mit Anzahl Bewerbungen
      responses:
        "200":
          description: Firmen, alphabetisch
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Company" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCompany
      tags: [Companies]
      summary: Firma anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCompany
      tags: [Companies]
      responses:
        "200":
          description: Firma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCompany
      tags: [Companies]
      summary: Firma ändern (nur gesetzte Felder; "" löscht optionale Felder)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyPatch" }
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCompany
      tags: [Companies]
      summary: Firma löschen (nur ohne Bewerbungen, sonst 409)
      responses:
        "204":
          description: Gelöscht
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications:
    get:
      operationId: listApplications
      tags: [Applications]
      parameters:
        - name: phase
          in: query
          schema: { $ref: "#/components/schemas/Phase" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EventType" }
        - name: q
          in: query
          description: Suche in Firmenname und Stellentitel
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Bewerbungen, zuletzt geänderte zuerst
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationSummary" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Bewerbung inklusive erstem Ereignis (Vorgemerkt oder Beworben) anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getApplication
      tags: [Applications]
      responses:
        "200":
          description: Bewerbung mit Ereignis-Timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateApplication
      tags: [Applications]
      summary: Stammdaten ändern (nicht den Status)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationPatch" }
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteApplication
      tags: [Applications]
      responses:
        "204":
          description: Gelöscht
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addEvent
      tags: [Applications]
      summary: Statuswechsel als Ereignis erfassen (422 bei unerlaubtem Übergang)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewEvent" }
      responses:
        "201":
          description: Erfasst
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{id}/events/latest:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: undoLastEvent
      tags: [Applications]
      summary: Letztes Ereignis rückgängig machen
      responses:
        "200":
          description: Bewerbung nach dem Rückgängigmachen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{id}/allowed-events:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listAllowedEvents
      tags: [Applications]
      responses:
        "200":
          description: Als Nächstes erlaubte Ereignistypen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventType" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/deadlines:
    get:
      operationId: listDeadlines
      tags: [Dashboard]
      parameters:
        - name: within_days
          in: query
          description: Zeitraum ab heute (Standard 7); überfällige Fristen sind immer enthalten
          schema: { type: integer, minimum: 0, maximum: 365 }
      responses:
        "200":
          description: Offene Fristen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deadline" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/appointments:
    get:
      operationId: listAppointments
      tags: [Dashboard]
      parameters:
        - name: within_days
          in: query
          description: Zeitraum ab heute (Standard 14)
          schema: { type: integer, minimum: 0, maximum: 365 }
      responses:
        "200":
          description: Anstehende Termine
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/stats/funnel:
    get:
      operationId: getFunnel
      tags: [Dashboard]
      responses:
        "200":
          description: Funnel-Stufen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FunnelStep" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/stats/summary:
    get:
      operationId: getSummary
      tags: [Dashboard]
      responses:
        "200":
          description: Kennzahlen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/cv:
    get:
      operationId: getCv
      tags: [Cv]
      summary: Lebenslauf lesen (leere Struktur, solange keiner gespeichert ist)
      responses:
        "200":
          description: Lebenslauf
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cv" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveCv
      tags: [Cv]
      summary: Lebenslauf ersetzen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Cv" }
      responses:
        "200":
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cv" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/cv/photo:
    get:
      operationId: getCvPhoto
      tags: [Cv]
      summary: Bewerbungsfoto (JPEG); 404, solange keines gespeichert ist
      responses:
        "200":
          description: Foto
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveCvPhoto
      tags: [Cv]
      summary: Bewerbungsfoto ersetzen (JPEG, max. 1 MB)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Gespeichert
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCvPhoto
      tags: [Cv]
      summary: Bewerbungsfoto entfernen
      responses:
        "204":
          description: Entfernt
        default: { $ref: "#/components/responses/Problem" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Fehler nach RFC 9457
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    EventType:
      type: string
      enum:
        - Vorgemerkt
        - Beworben
        - ScreeningGespraech
        - ChallengeErhalten
        - ChallengeAbgegeben
        - Interview
        - Kennenlerntag
        - AngebotErhalten
        - AngebotAngenommen
        - AngebotAbgelehnt
        - Absage
        - Zurueckgezogen
        - KeineRueckmeldung
    Phase:
      type: string
      enum: [Vorbereitung, Aktiv, Abgeschlossen]
    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        website: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 5000 }
    CompanyPatch:
      type: object
      description: Nur gesetzte Felder werden geändert; ein leerer String löscht ein optionales Feld.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        website: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 5000 }
    Company:
      type: object
      required: [id, name, created_at, application_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        website: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        application_count: { type: integer }
    NewEvent:
      type: object
      required: [type, occurred_on]
      properties:
        type: { $ref: "#/components/schemas/EventType" }
        occurred_on: { type: string, format: date }
        due_on:
          type: string
          format: date
          description: Nur bei Vorgemerkt, ChallengeErhalten und AngebotErhalten erlaubt
        note: { type: string, maxLength: 5000 }
    Event:
      type: object
      required: [id, type, occurred_on, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/EventType" }
        occurred_on: { type: string, format: date }
        due_on: { type: string, format: date }
        interview_round: { type: integer }
        note: { type: string }
        created_at: { type: string, format: date-time }
    ApplicationInput:
      type: object
      required: [company_id, position_title, first_event]
      properties:
        company_id: { type: string, format: uuid }
        position_title: { type: string, minLength: 1, maxLength: 300 }
        job_url: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 200 }
        source: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 5000 }
        first_event: { $ref: "#/components/schemas/NewEvent" }
    ApplicationPatch:
      type: object
      description: Nur gesetzte Felder werden geändert; ein leerer String löscht ein optionales Feld.
      properties:
        company_id: { type: string, format: uuid }
        position_title: { type: string, minLength: 1, maxLength: 300 }
        job_url: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 200 }
        source: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 5000 }
    ApplicationSummary:
      type: object
      required: [id, company_id, company_name, position_title, status, phase, updated_at, last_event_on]
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        company_name: { type: string }
        position_title: { type: string }
        status: { $ref: "#/components/schemas/EventType" }
        phase: { $ref: "#/components/schemas/Phase" }
        updated_at: { type: string, format: date-time }
        last_event_on: { type: string, format: date }
        open_due_on: { type: string, format: date }
    Application:
      type: object
      required: [id, company_id, company_name, position_title, status, phase, created_at, updated_at, events]
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        company_name: { type: string }
        position_title: { type: string }
        job_url: { type: string }
        location: { type: string }
        source: { type: string }
        notes: { type: string }
        status: { $ref: "#/components/schemas/EventType" }
        phase: { $ref: "#/components/schemas/Phase" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
    Deadline:
      type: object
      required: [application_id, company_name, position_title, event_type, due_on, overdue]
      properties:
        application_id: { type: string, format: uuid }
        company_name: { type: string }
        position_title: { type: string }
        event_type: { $ref: "#/components/schemas/EventType" }
        due_on: { type: string, format: date }
        overdue: { type: boolean }
    Appointment:
      type: object
      required: [application_id, company_name, position_title, event_type, date]
      properties:
        application_id: { type: string, format: uuid }
        company_name: { type: string }
        position_title: { type: string }
        event_type: { $ref: "#/components/schemas/EventType" }
        date: { type: string, format: date }
        interview_round: { type: integer }
    FunnelStep:
      type: object
      required: [stage, reached, rate]
      properties:
        stage: { type: string }
        reached: { type: integer }
        rate: { type: number, format: double }
    RejectionCount:
      type: object
      required: [event_type, count]
      properties:
        event_type: { $ref: "#/components/schemas/EventType" }
        count: { type: integer }
    SourceStats:
      type: object
      required: [source, applied, reached_interview, reached_offer]
      properties:
        source: { type: string }
        applied: { type: integer }
        reached_interview: { type: integer }
        reached_offer: { type: integer }
    Summary:
      type: object
      required: [applied, responded, response_rate, rejections_after, by_source]
      properties:
        applied: { type: integer }
        responded: { type: integer }
        response_rate: { type: number, format: double }
        median_days_to_response: { type: number, format: double }
        avg_days_to_response: { type: number, format: double }
        rejections_after:
          type: array
          items: { $ref: "#/components/schemas/RejectionCount" }
        by_source:
          type: array
          items: { $ref: "#/components/schemas/SourceStats" }
    Problem:
      type: object
      required: [type, title, status]
      additionalProperties: true
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        field: { type: string }
        from: { $ref: "#/components/schemas/EventType" }
        attempted: { $ref: "#/components/schemas/EventType" }
    CvPeriod:
      type: string
      description: Jahr oder Jahr-Monat, z. B. 2024 oder 2024-03
      pattern: '^\d{4}(-(0[1-9]|1[0-2]))?$'
    CvLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, minLength: 1, maxLength: 500 }
    CvPerson:
      type: object
      required: [name, links]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        headline: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 100 }
        location: { type: string, maxLength: 200 }
        links:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/CvLink" }
    CvExperience:
      type: object
      required: [role, organization, start, highlights]
      properties:
        role: { type: string, minLength: 1, maxLength: 200 }
        organization: { type: string, minLength: 1, maxLength: 200 }
        location: { type: string, maxLength: 200 }
        start: { $ref: "#/components/schemas/CvPeriod" }
        end: { $ref: "#/components/schemas/CvPeriod" }
        highlights:
          type: array
          maxItems: 15
          items: { type: string, maxLength: 500 }
    CvEducation:
      type: object
      required: [degree, institution, start]
      properties:
        degree: { type: string, minLength: 1, maxLength: 200 }
        institution: { type: string, minLength: 1, maxLength: 200 }
        start: { $ref: "#/components/schemas/CvPeriod" }
        end: { $ref: "#/components/schemas/CvPeriod" }
        details: { type: string, maxLength: 1000 }
    CvSkillGroup:
      type: object
      required: [category, items]
      properties:
        category: { type: string, minLength: 1, maxLength: 100 }
        items:
          type: array
          maxItems: 40
          items: { type: string, maxLength: 100 }
    CvProject:
      type: object
      required: [name, technologies]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 2000 }
        technologies:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
    CvLanguage:
      type: object
      required: [language, level]
      properties:
        language: { type: string, minLength: 1, maxLength: 100 }
        level: { type: string, minLength: 1, maxLength: 100 }
    Cv:
      type: object
      description: Lebenslauf. end fehlt = bis heute. updated_at wird beim Speichern ignoriert. Solange kein Lebenslauf gespeichert ist, liefert GET eine leere Struktur (person.name leer, Listen leer, ohne updated_at).
      required: [person, experience, education, skills, projects, languages]
      properties:
        person: { $ref: "#/components/schemas/CvPerson" }
        summary: { type: string, maxLength: 3000 }
        experience:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/CvExperience" }
        education:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CvEducation" }
        skills:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CvSkillGroup" }
        projects:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CvProject" }
        languages:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/CvLanguage" }
        updated_at: { type: string, format: date-time }
