name: bewerbungsmanager

# Log-Rotation für alle Dienste: höchstens 3 Dateien à 10 MB je Container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bewerbungen
      POSTGRES_USER: bewerbungen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bewerbungen}
      TZ: Europe/Berlin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bewerbungen -d bewerbungen"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    command: ["gotenberg", "--libreoffice-disable-routes=true", "--api-timeout=40s"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://bewerbungen:${POSTGRES_PASSWORD:-bewerbungen}@db:5432/bewerbungen?sslmode=disable
      GOTENBERG_URL: http://gotenberg:3000
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_TOKEN_MAIL: ${AGENT_TOKEN_MAIL:-}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-4200}:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
